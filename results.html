<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM - Results</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <main class="card" role="main">
    <header class="page-header">
      <h1>Problem results</h1>
    </header>

    <section id="problemInfo"></section>

    <h2>Participants</h2>
    <div id="resultsContainer"></div>

    <div class="actions">
      <a class="btn secondary" href="index.html">Back to home</a>
    </div>
  </main>

  <script type="module">
    import { db } from './js/firebase-config.js';

    import {
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    document.addEventListener('DOMContentLoaded', async () => {
      const problem = JSON.parse(localStorage.getItem('ttm_problem') || 'null');

      const problemInfo = document.getElementById('problemInfo');
      const resultsContainer = document.getElementById('resultsContainer');

      if (!problem) {
        problemInfo.innerHTML = '<p>No active problem found.</p>';
        return;
      }

      problemInfo.innerHTML = `
        <p><strong>Problem:</strong> ${problem.name}</p>
        <p><strong>Code:</strong> ${problem.code}</p>
        <p><strong>Alternatives:</strong> ${problem.alternatives.join(', ')}</p>
        <p><strong>Loading results...</strong></p>
      `;

      const resultsQuery = query(
        collection(db, "results"),
        where("problemCode", "==", problem.code)
      );

      const snapshot = await getDocs(resultsQuery);

      const results = [];
      snapshot.forEach(doc => {
        results.push(doc.data());
      });

      problemInfo.innerHTML = `
        <p><strong>Problem:</strong> ${problem.name}</p>
        <p><strong>Code:</strong> ${problem.code}</p>
        <p><strong>Alternatives:</strong> ${problem.alternatives.join(', ')}</p>
        <p><strong>Number of responses:</strong> ${results.length}</p>
      `;

      if (results.length === 0) {
        resultsContainer.innerHTML = '<p>No participant results have been saved yet.</p>';
        return;
      }

      resultsContainer.innerHTML = results.map((result, index) => {
        const ranking = Array.isArray(result.rankingOrder)
          ? result.rankingOrder.map(i => result.alternatives[i] ?? `Alternative ${i + 1}`).join(' > ')
          : 'No ranking available';

        return `
          <div class="result-card">
            <h3>Participant ${index + 1}: ${result.participantName}</h3>
            <p><strong>Role:</strong> ${result.participantRole}</p>
            <p><strong>Ranking:</strong> ${ranking}</p>
            <p><strong>Review decision:</strong> ${result.reviewDecision || '-'}</p>
            <p><strong>Completed from:</strong> ${result.completedFrom || '-'}</p>
            <p><strong>Finished at:</strong> ${result.finishedAt || '-'}</p>
          </div>
        `;
      }).join('');
    });
  </script>

</body>
</html>
