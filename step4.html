<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM · Step 4 (Review)</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/step4.css" />
  <meta name="theme-color" content="#3498db" />
</head>

<body>
  <!-- Logo -->
  <div class="site-logo">
    <a href="https://sinbad2.ujaen.es/" target="_blank" rel="noopener">
      <img src="img/logo-sinbad2.png" alt="SINBAD2 Research Group logo" />
    </a>
  </div>

  <!-- Selector de idioma -->
  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <!-- Contenido principal -->
  <main class="card" role="main">
    <header class="page-header">
      <h1 id="title" data-i18n="step4r_title"></h1>
      <p id="intro" class="lead" data-i18n="step4r_intro"></p>
    </header>
  
    <div class="step4-layout">
      <!-- Izquierda: RANKING -->
      <section class="panel panel-left" aria-labelledby="rankingTitle">
        <h2 id="rankingTitle" data-i18n="step4r_col_title"></h2>
  
        <div class="rank-scroll">
          <table class="rank-table" id="rankTable">
            <thead>
              <tr>
                <th class="rank-num" data-i18n="step4r_col_rank"></th>
                <th data-i18n="step4r_col_movie"></th>
                <th data-i18n="step4r_col_scale"></th>
              </tr>
            </thead>
            <tbody id="rankBody"></tbody>
          </table>
        </div>
      </section>
  
      <!-- Derecha: PREGUNTAS / CTA -->
      <aside class="panel panel-right sticky-qa" aria-labelledby="qaTitle">
        <h2 id="qaTitle" data-i18n="step4r_title"></h2>
  
        <div class="questions">
          <div class="question">
            <label data-i18n="step4r_q_rank_ok"></label>
            <div class="inline-opts">
              <label><input type="radio" name="rankOk" value="yes"> <span data-i18n="step4r_yes"></span></label>
              <label><input type="radio" name="rankOk" value="no">  <span data-i18n="step4r_no"></span></label>
            </div>
            <div id="noteRecompare" class="hint" style="display:none" data-i18n="step4r_logic_note_recompare"></div>
          </div>
  
          <fieldset id="cardsFieldset" class="question">
            <label data-i18n="step4r_q_cards_ok"></label>
            <div class="inline-opts">
              <label><input type="radio" name="cardsOk" value="yes"> <span data-i18n="step4r_yes"></span></label>
              <label><input type="radio" name="cardsOk" value="no">  <span data-i18n="step4r_no"></span></label>
            </div>
            <div id="noteCardsDisabled" class="hint" style="display:none" data-i18n="step4r_logic_note_cards_disabled"></div>
          </fieldset>
        </div>
  
        <div class="actions">
          <button id="continueBtn" class="btn navigate-button" data-i18n="step4r_continue">Continue</button>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/step4.js"></script>
</body>
</html>
