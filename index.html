<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="theme-color" content="#3498db" />
</head>
<body>
  <div class="site-logo">
    <a href="" target="_blank" rel="noopener">
      <img src="img/logo.png" alt="Tournament Tree Method" />
    </a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

<main class="card" role="main">
  <header class="page-header">
    <h1 id="title" data-i18n="home_title"></h1>
  </header>

  <p id="description" data-i18n="home_description"></p>

  <div class="home-options">

    <a class="home-card" href="create.html">
      <h2 data-i18n="home_create_title"></h2>
      <p data-i18n="home_create_description"></p>
    </a>

    <a class="home-card" href="join.html">
      <h2 data-i18n="home_join_title"></h2>
      <p data-i18n="home_join_description"></p>
    </a>

    <a class="home-card" href="admin.html">
      <h2 data-i18n="admin_access_title"></h2>
      <p data-i18n="admin_access_description"></p>
    </a>

  </div>
</main>

  <!-- Importante: i18n primero, luego app -->
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
