<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="theme-color" content="#3498db" />
</head>
<body>
  <div class="site-logo">
    <a href="https://sinbad2.ujaen.es/" target="_blank" rel="noopener">
      <img src="img/logo-sinbad2.png" alt="SINBAD2 Research Group logo" />
    </a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <main class="card" role="main">
    <header class="page-header">
      <h1 id="title" data-i18n="index_title"></h1>
    </header>

    <p id="description" data-i18n="index_description"></p>

    <form class="form" id="form" novalidate>
      <div class="field">
        <label for="name_box" id="name_label" data-i18n="index_name_label"></label>
        <input id="name_box" class="input" type="text" name="name"
               data-i18n-placeholder="index_name_placeholder"
               autocomplete="name" required />
      </div>

      <div class="actions">
        <button id="nextButton" class="btn" type="submit" data-i18n="index_next_button"></button>
        <span class="thanks" id="thanks"></span>
      </div>
    </form>
  </main>

  <!-- Importante: i18n primero, luego app -->
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
