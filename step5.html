<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM · Step 5</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="theme-color" content="#3498db" />

  <style>
    .layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; }
    .panel h2 { margin: 0 0 6px; font-size: 17px; }
    .lead { color: var(--muted); margin-top: 4px; }

    .rank-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .rank-table th, .rank-table td { padding: 8px 6px; border-bottom: 1px solid #f1f5f9; text-align: left; }
    .rank-table th { font-weight: 700; font-size: 13px; color: #6b7280; }
    .rank-num { width: 52px; color: #6b7280; }

    .movie-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; border: 1px solid #e5e7eb; border-radius: 999px;
      background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06);
      font-size: 13px; color: #374151; cursor: help;
    }

    .pairs-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .pair-row { display: grid; grid-template-rows: auto auto auto; gap: 8px; justify-items: center; align-items: start; }
    .sentence { font-size: 14px; color: #374151; text-align: center; }

    .pile-wrap { display: flex; justify-content: center; }
    .card-pile {
      position: relative; width: 520px; height: 160px;
      background: #f9fafb; border: 1px dashed #d1d5db; border-radius: 10px; padding: 8px; overflow: hidden;
    }
    .pile-count { position: absolute; bottom: 6px; right: 8px; font-size: 11px; color: #374151; background: rgba(255,255,255,.9); padding: 1px 6px; border-radius: 999px; border: 1px solid #e5e7eb; }

    .card-tile { position: absolute; width: 76px; height: 108px; border-radius: 8px; background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 4px 10px rgba(0,0,0,.10); transform-origin: 50% 80%; user-select: none; }
    .card-face { position: absolute; inset: 6px; border-radius: 7px; background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(249,250,251,0.92)); }
    .card-rank, .card-suit { position: absolute; font-size: 13px; font-weight: 700; line-height: 1; }
    .card-rank { top: 6px; left: 8px; }
    .card-suit { bottom: 6px; right: 8px; transform: rotate(180deg); }
    .suit-red .card-rank, .suit-red .card-suit { color: #dc2626; }
    .suit-black .card-rank, .suit-black .card-suit { color: #111827; }

    .controls { display: flex; gap: 8px; align-items: center; justify-content: center; }
    .ctrl-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .ctrl-input { width: 72px; height: 36px; text-align: center; border-radius: 8px; border: 1px solid #d1d5db; }

    .footer { margin-top: 18px; display: grid; justify-items: center; gap: 10px; }
    .navigate-button { width: 220px; height: 46px; }

    @media (max-width: 720px) { .card-pile { width: 92vw; } }
  </style>
</head>
<body>
  <div class="site-logo">
    <a href="" target="_blank" rel="noopener">
      <img src="img/logo.png" alt="Tournament Tree Method" />
    </a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <main class="card" role="main">
    <header class="page-header">
      <h1 id="title" data-i18n="step5_title">Step 5</h1>
      <p class="lead" id="introText" data-i18n="step5_intro"></p>
    </header>

    <div class="layout">
      <!-- IZQUIERDA: tablas -->
      <section class="panel" aria-labelledby="rankingTitle">
        <h2 id="rankingTitle" data-i18n="step5_title_table"></h2>

        <!-- Tabla referencia (usa SIEMPRE el ranking calculado) -->
        <table class="rank-table" id="rankTable">
          <thead>
            <tr>
              <th class="rank-num" data-i18n="step4r_col_rank"></th>
              <th data-i18n="step4r_col_movie"></th>
              <th data-i18n="step4r_col_scale"></th>
              <!-- última columna = column (ordenado por el ranking calculado) -->
              <th id="accPrevHeader" data-i18n="step5_left_accum_header"></th>
            </tr>
          </thead>
          <tbody id="rankBody"></tbody>
        </table>

        <!-- Tabla EN VIVO (usa el orden efectivo) -->
        <h2 style="margin-top:16px" id="liveTitle" data-i18n="step5_live_title"></h2>
        <table class="rank-table" id="rankTableLive">
          <thead>
            <tr>
              <th class="rank-num" data-i18n="step4r_col_rank">Rank</th>
              <th data-i18n="step4r_col_movie">Movie</th>
              <th data-i18n="step4r_col_scale">Value scale</th>
              <!-- última columna = acumulado (vivo) -->
              <th id="accCurrHeader" data-i18n="step5_left_accum_header"></th>
            </tr>
          </thead>
          <tbody id="rankBodyLive"></tbody>
        </table>
      </section>

      <!-- DERECHA: mazos -->
      <section class="panel" aria-labelledby="cardsTitle">
        <h2 id="cardsTitle" data-i18n="step5_right_title">Adjust cards</h2>
        <div class="pairs-grid" id="pairsGrid"></div>
        <div class="footer">
          <button class="btn navigate-button" id="saveBtn" data-i18n="step5_continue">Continue</button>
        </div>
      </section>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>

  <script type="module">
    import { saveCurrentParticipantResult }
      from './js/results.js';

    window.saveCurrentParticipantResult =
      saveCurrentParticipantResult;
  </script>

  <script src="js/step5.js"></script>

</body>
</html>
