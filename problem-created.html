<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM - Problem created</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="site-logo">
    <a href="" target="_blank" rel="noopener">
      <img src="img/logo.png" alt="Tournament Tree Method" />
    </a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <main class="card" role="main">

    <header class="page-header">
      <h1 data-i18n="problem_created_title"></h1>
    </header>

    <p data-i18n="problem_created_description"></p>

    <div class="problem-code-box">
      <span id="problemCode"></span>
    </div>

    <div class="actions">
      <a class="btn secondary" href="index.html" data-i18n="back"></a>
      <a class="btn" href="step3.html" data-i18n="continue"></a>
      <a class="btn secondary" href="results.html">View results</a>
    </div>

  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const problem = JSON.parse(localStorage.getItem('ttm_problem') || 'null');

      if (!problem) {
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('problemCode').textContent = problem.code;
    });
  </script>

</body>
</html>
