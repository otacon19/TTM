<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TTM - Admin Access</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="site-logo">
    <a href="" target="_blank" rel="noopener">
      <img src="img/logo.png" alt="Tournament Tree Method" />
    </a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <main class="card" role="main">

    <header class="page-header">
      <h1 data-i18n="admin_access_title"></h1>
    </header>

    <p class="lead" data-i18n="admin_description"></p>

    <form id="adminForm" class="form">

      <div class="field">
        <label for="problemCode" data-i18n="problem_code"></label>
        <input
          type="text"
          id="problemCode"
          class="input"
          required
          placeholder="TTM-XXXXXX"
        />
      </div>

      <div class="field">
        <label for="creatorCode" data-i18n="creator_code"></label>
        <input
          type="text"
          id="creatorCode"
          class="input"
          required
          placeholder="ADM-XXXXXX"
        />
      </div>

      <p id="adminError" class="error-message" hidden></p>

      <div class="actions">
        <button
          type="submit"
          class="btn"
          data-i18n="view_results">
        </button>

        <a
          href="index.html"
          class="btn secondary"
          data-i18n="back_home">
        </a>
      </div>

    </form>

  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/admin.js"></script>

</body>
</html>
