<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTM elements</title>
    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }

        .text-box-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-box {
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            width: 80%;
            border: 1px solid #ccc; /* Añadido */
        }

        .button-container {
            margin-top: 20px;
        }

        .navigate-button {
            margin-top: 10px;
            width: 150px;
            height: 50px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .navigate-button:hover {
            background-color: #2980b9;
        }
        
        .navigate-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .invalid {
            border-color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-box-container" id="text-box-container">
            <p id="description">Introduce the name of the movies.</p>
        </div>
        <div class="button-container">
            <button id="nextButton" class="navigate-button" onclick="goToNextStep()">Next</button>
        </div>
    </div>

    <script>
      
        const translations = {
            en: {
                description: "Introduce the name of the movies.",
                nextButton: "Next",
            },
            es: {
                description: "Introduce el nombre de las películas.",
                nextButton: "Siguiente",
            }
        };

        function changeLanguage(language) {
            document.getElementById('description').textContent = translations[language].description;
            document.getElementById('nextButton').textContent = translations[language].nextButton;
        }

        const n = Number(localStorage.getItem('n'));

        document.addEventListener("DOMContentLoaded", function() {
            const savedLanguage = localStorage.getItem('language') || 'en';
            changeLanguage(savedLanguage);

            const container = document.getElementById('text-box-container');
            for (let i = 0; i < n; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'text-box';
                input.addEventListener('input', validateTextBoxes);
                container.appendChild(input);
            }

            validateTextBoxes();
        });

        function validateTextBoxes() {
            const textBoxes = document.getElementsByClassName('text-box');
            let allFilled = true;

            for (let i = 0; i < textBoxes.length; i++) {
                if (textBoxes[i].value === '') {
                    allFilled = false;
                    textBoxes[i].classList.add('invalid');
                } else {
                    textBoxes[i].classList.remove('invalid');
                }
            }

            const actionButton = document.getElementById('nextButton');
            actionButton.disabled = !allFilled;
        }

        function goToNextStep() { //Pass the values by URL separated by commas
            const textBoxes = document.getElementsByClassName('text-box');
            let moviesNames = [];

            for (let i = 0; i < textBoxes.length; i++) { moviesNames.push(textBoxes[i].value); }

            localStorage.setItem('movies', moviesNames.join(','));

            window.location.href = `step3.html`;
        }

    </script>
</body>
</html>
