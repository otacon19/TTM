<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM - Step 2</title>

  <!-- Tipografías + estilos comunes -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <meta name="theme-color" content="#3498db" />
</head>
<body>
  <!-- Logo fijo fuera de la tarjeta -->
  <div class="site-logo">
    <a href="https://sinbad2.ujaen.es/" target="_blank" rel="noopener">
      <img src="img/logo-sinbad2.png" alt="SINBAD2 Research Group logo" />
    </a>
  </div>

  <!-- Selector de idioma -->
  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <!-- Contenido principal -->
  <main class="card" role="main">
    <header class="page-header">
      <h1 id="title" data-i18n="step2_title"></h1>
    </header>

    <!-- Descripción específica del paso (i18n centralizado en index.js) -->
    <p id="description" data-i18n="step2_description">
    </p>

    <form class="form" id="form" data-next="step3.html" novalidate>
      <div class="field">
        <div id="movie-list" class="text-box-container"></div>
      </div>

      <div class="actions">
        <button id="nextButton" class="btn" type="submit" data-i18n="next">Next</button>
      </div>
    </form>
  </main>

  <!-- Lógica común (i18n + UX) -->
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Lógica específica del Paso 2 — genera inputs en función de n y aplica i18n centralizado
    document.addEventListener('DOMContentLoaded', () => {
      const n = Math.max(3, Math.min(6, parseInt(localStorage.getItem('n') || '3', 10)));
      const list = document.getElementById('movie-list');

      for (let i = 1; i <= n; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'input text-box';
        input.setAttribute('data-i18n', 'movie_placeholder');
        input.setAttribute('data-i', String(i));
        input.addEventListener('input', () => {
          // Validación ligera por campo
          input.classList.toggle('invalid', !input.value.trim());
          validateAll();
        });
        list.appendChild(input);
      }

      // Aplicar i18n a los nuevos nodos creados
      if (window.TTM?.refresh) window.TTM.refresh();

      function validateAll() {
        const inputs = document.querySelectorAll('#movie-list input[type="text"]');
        let allFilled = true;
        inputs.forEach(inp => {
          const empty = !inp.value.trim();
          inp.classList.toggle('invalid', empty);
          if (empty) allFilled = false;
        });
        const btn = document.getElementById('nextButton');
        if (btn) btn.disabled = !allFilled;
        return allFilled;
      }

      // Validación inicial
      validateAll();

      // Envío
      const form = document.getElementById('form');
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        if (!validateAll()) return;
        const values = Array.from(document.querySelectorAll('#movie-list input[type="text"]'))
          .map(i => i.value.trim());
        localStorage.setItem('movies', values.join(','));
        const nextUrl = form.getAttribute('data-next') || 'step3.html';
        window.location.href = nextUrl;
      });
    });
  </script>
</body>
</html>
