<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>
<style>
    body {
        font-family: 'Lato', sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        text-align: center;
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
        color: #333;
        font-size: 2.5rem;
    }

    p {
        color: #666;
        font-size: 16px;
        margin-top: 10px;
    }
</style>
</head>
<body>
    <div class="container">
        <h1 id="thanks">Thank You!</h1>
        <p id="thanks2">We appreciate your participation.</p>
    </div>
</body>

<script>
    const translations = {
        en: {
            thanks:"Thank You!",
            thanks2: "We appreciate your participation.",
        },
        es: {
            thanks:"¡Gracias!",
            thanks2: "Agradecemos tu participación.",
        }
    };

    function changeLanguage(language) {
        document.getElementById('thanks').textContent = translations[language].thanks;
        document.getElementById('thanks2').textContent = translations[language].thanks2;    
    }

    document.addEventListener("DOMContentLoaded", () => {
        const savedLanguage = localStorage.getItem('language') || 'en';
        changeLanguage(savedLanguage);
    });

</script>

</html>
