<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM · Gracias</title>

  <!-- Mismas fuentes y estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#3498db" />
</head>
<body>
  <!-- Logo fijo -->
  <div class="site-logo">
    <a href="https://sinbad2.ujaen.es/" target="_blank" rel="noopener">
      <img src="img/logo-sinbad2.png" alt="SINBAD2 Research Group logo" />
    </a>
  </div>

  <!-- Selector de idioma -->
  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <!-- Contenido principal -->
  <main class="card" role="main" style="text-align:center;">
    <header class="page-header">
      <h1 id="goodbye_title" data-i18n="goodbye_title"></h1>
    </header>

    <p id="goodbye_text" data-i18n="goodbye_text" style="margin: 8px 0 18px;">
    </p>
  </main>

  <!-- Lógica común (incluye i18n y listeners de idioma) -->
  <script src="js/index.js"></script>
</body>
</html>
