<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM - Thanks</title>

  <!-- Mismas fuentes y estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="theme-color" content="#3498db" />
</head>

<body>
  <!-- Logo fijo -->
  <div class="site-logo">
    <a href="" target="_blank" rel="noopener">
      <img src="img/logo.png" alt="Tournament Tree Method" />
    </a>
  </div>

  <!-- Selector de idioma -->
  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <!-- Contenido principal -->
  <main class="card" role="main" style="text-align:center;">
    <header class="page-header">
      <h1 id="goodbye_title" data-i18n="goodbye_title"></h1>
      <p data-i18n="goodbye_saved"></p>
    </header>
    <div style="margin-top:16px">
      <button id="restartBtn" class="btn navigate-button" data-i18n="goodbye_restart">
      </button>
    </div>
  </main>

  <script>
    // Mantener el idioma, limpiar el resto y volver a step1
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('restartBtn');
      btn?.addEventListener('click', () => {
        const lang = localStorage.getItem('language'); // conservar idioma elegido
        // Borra TODO para evitar conflictos entre sesiones anteriores
        localStorage.clear();
        sessionStorage.clear();
        // (opcional) conservar idioma
        if (lang) localStorage.setItem('language', lang);

        // Ir al primer paso
        window.location.href = 'index.html';
      });
    });
  </script>

  <!-- Lógica común (incluye i18n y listeners de idioma) -->
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
