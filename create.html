<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTM - Create problem</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <meta name="theme-color" content="#3498db" />
</head>

<body>

  <div class="site-logo">
    <a href="" target="_blank" rel="noopener">
      <img src="img/logo.png" alt="Tournament Tree Method" />
    </a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <main class="card" role="main">
    <header class="page-header">
      <h1 data-i18n="create_title"></h1>
    </header>

    <p data-i18n="create_description"></p>

    <form class="form" id="createProblemForm" novalidate>

      <div class="field">
        <label for="problemName" data-i18n="create_problem_name_label"></label>
        <input
          type="text"
          class="input"
          id="problemName"
          data-i18n="create_problem_name_placeholder"
        />
      </div>

      <div class="field">
        <label for="creatorName" data-i18n="participant_name_label"></label>
        <input
          type="text"
          class="input"
          id="creatorName"
          data-i18n="participant_name_placeholder"
        />
      </div>

      <div class="field">
        <label for="alternativesNumber" data-i18n="create_alternatives_number_label"></label>
        <input
          type="number"
          class="input"
          id="alternativesNumber"
          min="3"
          max="50"
          step="1"
          value="3"
        />
      </div>

      <div class="field">
        <label data-i18n="create_alternatives_names_label"></label>
        <div id="alternativesList" class="text-box-container"></div>
      </div>

      <div class="actions">
        <a class="btn secondary" href="index.html" data-i18n="back"></a>
        <button id="createProblemButton" class="btn" type="submit" data-i18n="create_problem_button"></button>
      </div>

    </form>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/create.js"></script>

</body>
</html>
