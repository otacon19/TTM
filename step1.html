<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournament Tree Model · Paso 1</title>

  <!-- Tipografías + estilos comunes -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <meta name="theme-color" content="#3498db" />
</head>
<body>
  <!-- Logo fijo fuera de la tarjeta -->
  <div class="site-logo">
    <a href="https://sinbad2.ujaen.es/" target="_blank" rel="noopener">
      <img src="img/logo-sinbad2.png" alt="SINBAD2 Research Group logo" />
    </a>
  </div>

  <!-- Selector de idioma -->
  <div class="lang-switch" role="group" aria-label="Language selector">
    <button type="button" id="btn-en" title="English" aria-label="English">
      <img src="img/english.png" alt="English flag" />
    </button>
    <button type="button" id="btn-es" title="Español" aria-label="Español">
      <img src="img/spanish.png" alt="Bandera de España" />
    </button>
  </div>

  <!-- Contenido principal -->
  <main class="card" role="main">
    <header class="page-header">
      <h1 id="title">Tournament Tree Model · Step 1</h1>
    </header>

    <!-- Descripción específica de este paso (i18n) -->
    <p id="description" data-i18n="step1_description">
      Introduce the number of movies to compare. Select between 4 and 6 movies.
    </p>

    <form class="form" id="form" data-next="step2.html" novalidate>
      <div class="field">
        <label for="spinner" data-i18n="movies_number">Number of movies</label>
        <input type="number" class="input" id="spinner" min="4" max="6" step="1" value="4" />
      </div>

      <div class="actions">
        <button id="nextButton" class="btn" type="submit" data-i18n="next">Next</button>
      </div>
    </form>
  </main>

  <!-- Lógica común (i18n + UX) -->
  <script src="js/index.js"></script>
  <script>
    // Lógica específica de este paso
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form');
      const spinner = document.getElementById('spinner');
      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const n = Math.max(4, Math.min(6, parseInt(spinner.value || '4', 10)));
        localStorage.setItem('n', String(n));
        const nextUrl = form.getAttribute('data-next') || 'step2.html';
        window.location.href = `${nextUrl}?count=${n}`;
      });
    });
  </script>
</body>
</html>
